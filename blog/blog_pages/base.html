<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мой магазин{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div style="background: #f8f9fa; padding: 8px 20px; text-align: right; border-bottom: 1px solid #ddd;">
    {% if user.is_authenticated %}
        <span style="margin-right: 15px;">👤 {{ user.email }}</span>
        <a href="{% url 'users:logout' %}" style="color: red;">🚪 Выйти</a>
    {% else %}
        <a href="{% url 'users:register' %}" style="margin-right: 15px;">Регистрация</a>
        <a href="{% url 'users:login' %}">Войти</a>
    {% endif %}
</div>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
        <a class="navbar-brand" href="/">Мой магазин</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/">Главная</a></li>
            <li class="nav-item"><a class="nav-link" href="/contacts/">Контакты</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'blog:list' %}">Блог</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<footer class="bg-dark text-white text-center py-3 mt-5">
    <div class="container">
        &copy; 2026 Мой магазин
    </div>
</footer>

</body>
</html>
