<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты — Магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- ===== ХЕДЕР ===== -->
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
        <a class="navbar-brand" href="{% url 'index' %}">Мой магазин</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'contacts' %}">Контакты</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
<div class="container mt-4">

    {% if success %}
    <div class="alert alert-success mt-3">
        ✅ Сообщение отправлено! Мы свяжемся с вами.
    </div>
    {% endif %}

    <h1>Контакты</h1>
    <p>Свяжитесь с нами любым удобным способом</p>

    <div class="row mt-4">
        <div class="col-md-6">
            <h5>Наш адрес</h5>
            <p>г. Москва</p>

            <h5>Телефон</h5>
            <p>+7...</p>

            <h5>Email</h5>
            <p>myshop@shop.ru</p>
        </div>

        <div class="col-md-6">
            <h5>Напишите нам</h5>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="name" class="form-label">Имя</label>
                    <input type="text" class="form-control" id="name" name="name">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email">
                </div>
                <div class="mb-3">
                    <label for="message" class="form-label">Сообщение</label>
                    <textarea class="form-control" id="message" name="message" rows="4"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Отправить</button>
            </form>
        </div>
    </div>
</div>

<!-- ===== ФУТЕР ===== -->
<footer class="bg-light text-center text-muted py-3 mt-5">
    <div class="container">
        &copy; 2026 Мой магазин. Все права защищены.
    </div>
</footer>

</body>
</html>
