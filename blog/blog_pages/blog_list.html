{% extends 'base.html' %}

{% block content %}
<h1>Блог</h1>
<a href="{% url 'blog:create' %}" class="btn btn-primary mb-3">Создать запись</a>

<div class="row">
    {% for post in posts %}
    <div class="col-md-4 mb-4">
        <div class="card h-100">
            {% if post.preview %}
                <img src="{{ post.preview.url }}" class="card-img-top" alt="{{ post.title }}">
            {% else %}
                <img src="https://via.placeholder.com/300x200?text=Нет+фото" class="card-img-top" alt="Нет фото">
            {% endif %}
            <div class="card-body">
                <h5 class="card-title">{{ post.title }}</h5>
                <p class="card-text">{{ post.content|truncatechars:100 }}</p>
                <a href="{% url 'blog:detail' post.pk %}" class="btn btn-outline-primary">Читать</a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <p>Нет опубликованных записей.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
