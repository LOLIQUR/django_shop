<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная — Магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="{% url 'index' %}"><i class="fas fa-store"></i> Мой магазин</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'index' %}"><i class="fas fa-home"></i> Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'contacts' %}"><i class="fas fa-envelope"></i> Контакты</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1 class="mb-3">Добро пожаловать в магазин</h1>
    <p class="lead">Лучшие товары по лучшим ценам</p>

    <div class="row mt-4">
        <div class="col-md-4">
            <div class="card h-100">
                <img src="https://via.placeholder.com/300x150" class="card-img-top" alt="Товар 1">
                <div class="card-body">
                    <h5 class="card-title">Товар 1</h5>
                    <p class="card-text">Отличное качество.</p>
                    <span class="badge bg-success">$100</span>
                    <a href="#" class="btn btn-outline-primary btn-sm mt-2 d-block">Купить</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100">
                <img src="https://via.placeholder.com/300x150" class="card-img-top" alt="Товар 2">
                <div class="card-body">
                    <h5 class="card-title">Товар 2</h5>
                    <p class="card-text">Отличное качество.</p>
                    <span class="badge bg-success">$150</span>
                    <a href="#" class="btn btn-outline-primary btn-sm mt-2 d-block">Купить</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100">
                <img src="https://via.placeholder.com/300x150" class="card-img-top" alt="Товар 3">
                <div class="card-body">
                    <h5 class="card-title">Товар 3</h5>
                    <p class="card-text">Отличное качество.</p>
                    <span class="badge bg-success">$200</span>
                    <a href="#" class="btn btn-outline-primary btn-sm mt-2 d-block">Купить</a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center">
        <p class="mb-2">© 2026 Мой магазин. Все права защищены.</p>
        <p class="mb-0">
            <i class="fas fa-phone"></i> +7... &nbsp;|&nbsp;
            <i class="fas fa-envelope"></i> myshop@shop.ru
        </p>
    </div>
</footer>

</body>
</html>
