{% extends 'base.html' %}
{% block content %}
<h1>Редактировать товар</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Сохранить</button>
    <a href="{% url 'index' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
