{% extends 'base.html' %}

{% block content %}
<h1>{{ post.title }}</h1>

{% if post.preview %}
    <img src="{{ post.preview.url }}" class="img-fluid" alt="{{ post.title }}">
{% else %}
    <img src="https://via.placeholder.com/600x400?text=Нет+фото" class="img-fluid" alt="Нет фото">
{% endif %}

<p>{{ post.content }}</p>
<p><strong>Просмотров:</strong> {{ post.views_count }}</p>

<a href="{% url 'blog:list' %}" class="btn btn-secondary">Назад</a>
<a href="{% url 'blog:edit' post.pk %}" class="btn btn-warning">Редактировать</a>
<a href="{% url 'blog:delete' post.pk %}" class="btn btn-danger">Удалить</a>
{% endblock %}
