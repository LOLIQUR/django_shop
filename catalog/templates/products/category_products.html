{% extends 'base.html' %}

{% block content %}
<h1>Продукты в категории</h1>

<div class="row">
    {% for product in products %}
    <div class="col-md-4 mb-4">
        <div class="card">
            <div class="card-body">
                <h5>{{ product.name }}</h5>
                <p>{{ product.price }} ₽</p>
                <a href="{% url 'product_detail' product.pk %}" class="btn btn-primary btn-sm">Подробнее</a>
            </div>
        </div>
    </div>
    {% empty %}
    <p>Нет товаров в этой категории.</p>
    {% endfor %}
</div>
{% endblock %}
