{% extends 'base.html' %}

{% block content %}
<h1>{{ product.name }}</h1>

{% if product.image %}
    <img src="{{ product.image.url }}" class="img-fluid" alt="{{ product.name }}">
{% else %}
    <img src="https://via.placeholder.com/600x400?text=Нет+фото" class="img-fluid" alt="Нет фото">
{% endif %}

<p><strong>Цена:</strong> {{ product.price }} ₽</p>
<p><strong>Описание:</strong> {{ product.description }}</p>
<p><strong>Категория:</strong> {{ product.category.name }}</p>

<a href="{% url 'index' %}" class="btn btn-secondary">На главную</a>
<a href="{% url 'product_edit' product.pk %}" class="btn btn-warning">Редактировать</a>
<a href="{% url 'product_delete' product.pk %}" class="btn btn-danger">Удалить</a>
{% endblock %}
