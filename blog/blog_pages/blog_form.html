{% extends 'base.html' %}

{% block content %}
<h1>{% if object %}Редактировать{% else %}Создать{% endif %} запись</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Сохранить</button>
    <a href="{% url 'blog:list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
